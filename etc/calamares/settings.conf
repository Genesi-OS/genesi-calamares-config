#
# Configuration file for Calamares
#
# This is the top-level configuration file for Calamares.
# It specifies what modules will be used, as well as some
# overall characteristics -- is this a setup program, or
# an installer. More specific configuration is devolved
# to the branding file (for the UI) and the individual
# module configuration files (for functionality).
---
# Modules can be job modules (with different interfaces) and QtWidgets view
# modules. They could all be placed in a number of different paths.
# "modules-search" is a list of strings, each of these can either be a full
# path to a directory or the keyword "local".
#
# "local" means:
#   - modules in $LIBDIR/calamares/modules, with
#   - settings in SHARE/calamares/modules or /etc/calamares/modules.
# In debug-mode (e.g. calamares -d) "local" also adds some paths
# that make sense from inside the build-directory, so that you
# can build-and-run with the latest modules immediately.
#
modules-search: [ local ]

instances:
- id:       online
  module:   packages
  config:   packages_online.conf

- id:       online
  module:   welcome
  config:   welcome_online.conf

- id:       bootloader
  module:   packagechooser
  config:   packagechooser_bootloader.conf

# Genesi: desktop-environment chooser (Roadmap 5.1). method: netinstall-select
# in packagechooser.conf — the selected item id (KDE-Desktop / Hyprland-Desktop)
# activates the matching netinstall.yaml group. Without this instance + its
# packagechooser@desktop step in the show sequence below, the chooser is dead
# config and netinstall just installs whatever groups are `selected: true`
# (Plasma only), so the Hyprland option never appears in the installer.
- id:       desktop
  module:   packagechooser
  config:   packagechooser.conf

- id:       before-online
  module:   shellprocess
  config:   shellprocess-before-online.conf

- id:       drivers
  module:   shellprocess
  config:   shellprocess-drivers.conf

- id:       modify_mk_hook
  module:   shellprocess
  config:   shellprocess_modify_mk_hook.conf

- id:       reset_mk_hook
  module:   shellprocess
  config:   shellprocess_reset_mk_hook.conf

- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_initialize_pacman.conf

- id:       copy_genesi
  module:   shellprocess
  config:   shellprocess_copy_genesi.conf

- id:       enable_ufw
  module:   shellprocess
  config:   shellprocess_enable_ufw.conf

- id:       enable_sdboot
  module:   shellprocess
  config:   shellprocess_enable_sdboot.conf

# Genesi: bootloader finalization. Two self-gating shellprocess steps run
# back-to-back after `bootloader`/`grubcfg`; exactly ONE acts, decided by which
# loader the bootloader module actually installed — it writes /etc/default/limine
# ONLY for a Limine install. This stops a Limine install from aborting on the old
# unconditional GRUB finalizer (genesi-grub-setup.sh `exit 1`s when GRUB is not
# the active loader) WITHOUT relying on the contextualprocess module, which
# cachyos-calamares-next builds with -DSKIP_MODULES (it is NOT shipped).
- id:       genesi_grub
  module:   shellprocess
  config:   shellprocess_genesi_grub.conf

- id:       genesi_limine
  module:   shellprocess
  config:   shellprocess_genesi_limine.conf

# Genesi: GPU driver auto-detect (chwd). This instance MUST exist — the exec
# sequence references shellprocess@genesi_gpu, and a module@id with no matching
# instance is silently SKIPPED by Calamares (no error, no log). That is exactly
# how the chwd step never ran and every install shipped nouveau despite the
# correct `chwd -a 0300` config. Do not remove.
- id:       genesi_gpu
  module:   shellprocess
  config:   shellprocess_genesi_gpu.conf

# Genesi: default desktop session (X11). Same rule as genesi_gpu above — the
# exec sequence references shellprocess@genesi_session, so this instance must be
# declared or the step is silently skipped.
- id:       genesi_session
  module:   shellprocess
  config:   shellprocess_genesi_session.conf

# Sequence section. This section describes the sequence of modules, both
# viewmodules and jobmodules, as they should appear and/or run.
#
sequence:
- show:
  - welcome@online
  - locale
  - keyboard
  - partition
  - packagechooser@bootloader
  - packagechooser@desktop
  - netinstall
  - users
  - summary
- exec:
  - partition
  - zfs
  - mount
  - shellprocess@modify_mk_hook
  - shellprocess@initialize_pacman
  - pacstrap
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@before-online
  - packages@online
  # Genesi: auto-detect the GPU and install the matching driver via chwd, right
  # after the base packages land (network is up) and BEFORE initcpio. Covers
  # Pascal/Maxwell (proprietary nvidia) which nvidia-open can't drive. Runs in
  # the target chroot and is non-aborting (leading "-" in its script) — worst
  # case the system falls back to nouveau, the previous default. See
  # modules/shellprocess_genesi_gpu.conf.
  - shellprocess@genesi_gpu
  # Genesi: copy_genesi must run BEFORE users so /etc/skel is populated
  # with Genesi configs when the users module creates /home/<user>. Also
  # before initcpio (so mkinitcpio picks up the plymouth theme) and before
  # grubcfg (so GRUB_DISTRIBUTOR is in /etc/default/grub when grub.cfg is
  # generated).
  - shellprocess@copy_genesi
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - initcpio
  - users
  # Genesi: after the user is created, default their desktop session to Plasma
  # X11 (reliable on VMs and every GPU; Wayland breaks on VirtualBox/VMSVGA).
  # Must run AFTER users so the account exists. See
  # modules/shellprocess_genesi_session.conf.
  - shellprocess@genesi_session
  - networkcfg
  - displaymanager
  - hwclock
  - bootloader
  - grubcfg
  # Genesi: finalize the boot menu for whichever loader was chosen. Both run,
  # but each self-gates on /etc/default/limine so only the matching one acts.
  # GRUB: rewrite /etc/default/grub (distributor + branded background + colors)
  # and regenerate grub.cfg (scripts/genesi-grub-setup.sh). Limine: recolor
  # limine.conf to the Genesi palette + wire the snapshot stack
  # (scripts/genesi-limine-setup.sh). Must run AFTER bootloader and grubcfg.
  - shellprocess@genesi_grub
  - shellprocess@genesi_limine
  # - mhwdcfg  # DISABLED: module not found
  - shellprocess@reset_mk_hook
  - services-systemd
  # - preservefiles  # DISABLED: module not found
  - shellprocess
  - shellprocess@enable_ufw
  - shellprocess@enable_sdboot
  - umount
- show:
  - finished

# A branding component is a directory, either in SHARE/calamares/branding or
# in /etc/calamares/branding (the latter takes precedence). The directory must
# contain a YAML file branding.desc which may reference additional resources
# (such as images) as paths relative to the current directory.
#
branding: genesi

# If this is set to true, Calamares will show an "Are you sure?" prompt right
# before each execution phase, i.e. at points of no return. If this is set to
# false, no prompt is shown. Default is false, but Calamares will complain if
# this is not explicitly set.
#
prompt-install: true

# If this is set to true, Calamares will execute all target environment
# commands in the current environment, without chroot. This setting should
# only be used when setting up Calamares as a post-install configuration tool,
# as opposed to a full operating system installer.
#
dont-chroot: false

# If this is set to true, Calamares refers to itself as a "setup program"
# rather than an "installer". Defaults to the value of dont-chroot, but
# Calamares will complain if this is not explicitly set.
oem-setup: false

# If this is set to true, the "Cancel" button will be disabled entirely.
# The button is also hidden from view.
#
disable-cancel: false

# If this is set to true, the "Cancel" button will be disabled once
# you start the 'Installation', meaning there won't be a way to cancel
# the Installation until it has finished or installation has failed.
#
disable-cancel-during-exec: false

# If this is set to true, the "Next" and "Back" button will be hidden once
# you start the 'Installation'.
#
hide-back-and-next-during-exec: true

# If this is set to true, then once the end of the sequence has
# been reached, the quit (done) button is clicked automatically
# and Calamares will close.
#
quit-at-end: false
