#
# shellprocess_genesi_limine.conf
# Genesi OS: Limine boot-menu finalization + Btrfs snapshot recovery wiring.
# Counterpart of shellprocess_genesi_grub.conf. Runs (with genesi_grub) right
# after the bootloader/grubcfg steps; the script self-gates on
# /etc/default/limine so it is a clean no-op on a GRUB install and only acts when
# Limine was the chosen loader. All logic lives in the external script so
# Calamares never interprets $-variables. dontChroot: true and the target root is
# passed as an ARGUMENT (Calamares expands ${ROOT} in the command string but
# never exports it — same contract as shellprocess_genesi_grub.conf). The script
# never aborts the install (the system is already bootable after `bootloader`).
---
dontChroot: true
timeout: 3600

script:
 - command: "bash /etc/calamares/scripts/genesi-limine-setup.sh ${ROOT}"
   timeout: 3600
   verbose: true

i18n:
 name: "Finalizing Genesi OS Limine boot menu..."
 name[pt_BR]: "Finalizando o menu de inicialização Limine do Genesi OS..."
