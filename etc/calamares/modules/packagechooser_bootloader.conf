# Bootloader selection for Genesi OS
---
mode: required

method: legacy

labels:
    step: "Bootloader"

default: grub

items:
    - id: grub
      name: "GRUB"
      description: "GRUB is a reliable and widely-used boot manager that works on both UEFI and BIOS systems. It's the recommended bootloader for Genesi OS, with automatic Btrfs snapshot recovery entries right in the boot menu."
      screenshot: "/etc/calamares/images/grub.png"

    - id: limine
      name: "Limine (experimental)"
      description: "Limine is a modern, fast and beautiful boot manager with native Btrfs snapshot integration. EXPERIMENTAL on Genesi: the snapshot stack (limine-snapper-sync) needs a FAT32 /boot partition that the default disk layout does not yet create, so a Limine install can fail to boot. Support is under active development — choose GRUB unless you are testing Limine on purpose."
      screenshot: "/etc/calamares/images/limine.png"
