# Bootloader selection for Genesi OS
---
mode: required

method: legacy

labels:
    step: "Bootloader"

default: limine

items:
    - id: limine
      name: "Limine"
      description: "Limine is a modern, fast and beautiful boot manager with native Btrfs snapshot integration — when the system updates, snapshots show up right in the boot menu so you can roll back a broken boot in seconds. Works on both UEFI and BIOS. This is the recommended bootloader for Genesi OS."
      screenshot: "/etc/calamares/images/limine.png"

    - id: grub
      name: "GRUB"
      description: "GRUB is a reliable and widely-used boot manager that works on both UEFI and BIOS systems. Choose GRUB if you need its mature feature set (e.g. encrypted /boot). Genesi's snapshot recovery menu is available on GRUB too."
      screenshot: "/etc/calamares/images/grub.png"
