#
# Bootloader configuration. The bootloader is installed to allow
# the system to start (and pick one of the installed operating
# systems to run).
#
# Take note that Debian-derivatives that use unmodified GRUB EFI packages
# should specifically set *efiBootloaderId* to "debian" because that is
# hard-coded in `grubx64.efi`.
---
# Variable from packagechooser that determines which bootloader to use
efiBootLoaderVar: "packagechooser_bootloader"

# grub / systemd-boot / limine
# The actual bootloader is chosen at install time by the packagechooser
# (efiBootLoaderVar above), which defaults to "limine". This value is only the
# hard fallback used if that variable ever comes up empty — kept as "grub" for
# maximum compatibility (belt-and-suspenders; the chooser always sets it).
efiBootLoader: "grub"

# GRUB configuration
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Kernel parameters
kernelParams: [ "quiet" ]

efiBootloaderId: "genesi"

installEFIFallback: true

# Limine splash logo. The bootloader module copies this file to the ESP and
# references it as the Limine wallpaper. We reuse the Genesi GRUB theme
# background, which is ALWAYS present on the target (genesi-grub-theme is in the
# always-on "Genesi OS" netinstall group), so the splash is on-brand with zero
# extra asset and no missing-file warning. The Genesi palette + OS name are
# rewritten afterwards by genesi-limine-setup.sh (shellprocess@genesi_limine).
limineSplashLogo: "/usr/share/grub/themes/genesi/background.png"
