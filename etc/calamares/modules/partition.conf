#
# This setting specifies the mount point of the EFI system partition. Some
# distributions (Fedora, Debian, Manjaro, etc.) use /boot/efi, others (KaOS,
# etc.) use just /boot.
#
# Defaults to "/boot/efi", may be empty (but weird effects ensue)
efiSystemPartition:     "/boot"

efiSystemPartitionSize:     750M

# efiSystemPartitionName:     EFI

userSwapChoices:
    - none      # Create no swap, use no swap
#    - small     # Up to 4GB
#    - suspend   # At least main memory size
#    - reuse     # Re-use existing swap, but don't create any (unsupported right now)
#    - file      # To swap file instead of partition

# Correctly draw nested (e.g. logical) partitions as such.
drawNestedPartitions:   false

# Show/hide partition labels on manual partitioning page.
alwaysShowPartitionLabels: true

initialPartitioningChoice: none

initialSwapChoice: none

# Btrfs by default so every automatic install gets the genesi-snapshots
# "indestructible OS" protection (snapper + snap-pac + grub-btrfs) out of the
# box — those need Btrfs CoW subvolumes (see btrfsSubvolumes in mount.conf).
# Btrfs is as light as XFS day-to-day; XFS/ext4/f2fs/zfs stay selectable.
defaultFileSystemType:  "btrfs"

availableFileSystemTypes:  ["xfs","btrfs","ext4","f2fs","zfs"]

#enableLuksAutomatedPartitioning:    true

