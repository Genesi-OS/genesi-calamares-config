#
# This setting specifies the mount point of the EFI system partition. Some
# distributions (Fedora, Debian, Manjaro, etc.) use /boot/efi, others (KaOS,
# etc.) use just /boot.
#
# Defaults to "/boot/efi", may be empty (but weird effects ensue)
efiSystemPartition:     "/boot"

efiSystemPartitionSize:     750M

# efiSystemPartitionName:     EFI

userSwapChoices:
    - none      # Create no swap, use no swap
#    - small     # Up to 4GB
#    - suspend   # At least main memory size
#    - reuse     # Re-use existing swap, but don't create any (unsupported right now)
#    - file      # To swap file instead of partition

# Correctly draw nested (e.g. logical) partitions as such.
drawNestedPartitions:   false

# Show/hide partition labels on manual partitioning page.
alwaysShowPartitionLabels: true

initialPartitioningChoice: none

initialSwapChoice: none

# Btrfs by default so every automatic install gets the genesi-snapshots
# "indestructible OS" protection (snapper + snap-pac + grub-btrfs) out of the
# box — those need Btrfs CoW subvolumes (see btrfsSubvolumes in mount.conf).
# Btrfs is as light as XFS day-to-day; XFS/ext4/f2fs/zfs stay selectable.
defaultFileSystemType:  "btrfs"

# Btrfs FIRST: the erase/replace filesystem dropdown (ChoicePage) is populated
# in this exact order and its initial selection is simply the first list item —
# defaultFileSystemType above does NOT reposition it. With xfs first, the
# installer UI offered XFS by default (2026-07-17 report) even though the
# backend default was btrfs.
availableFileSystemTypes:  ["btrfs","xfs","ext4","f2fs","zfs"]

# Per-bootloader layout overrides. Limine's snapshot stack (limine-snapper-sync +
# limine-mkinitcpio-hook) REFUSES to deploy unless /boot is a mounted FAT32 boot
# partition ("Boot path '/boot' is not a mounted FAT32 boot partition"), so a
# Limine install needs a FAT32 ESP mounted at /boot (not /boot/efi), sized large
# enough to hold multiple kernels + initramfs + per-snapshot boot entries.
# Without this, Limine installs are unbootable (limine.conf ends up with no kernel
# entries and limine-bios.sys is never deployed correctly). This mirrors CachyOS.
# GRUB is deliberately NOT overridden — it keeps the top-level layout above, so
# GRUB installs are byte-for-byte unchanged (no regression). NOTE: this only
# takes effect on UEFI installs; BIOS has no ESP, so Limine on BIOS stays
# unsupported (pick GRUB there).
bootloaderOverrides:
    - name: limine
      efiSystemPartition: "/boot"
      efiSystemPartitionSize: 4192M

#enableLuksAutomatedPartitioning:    true

