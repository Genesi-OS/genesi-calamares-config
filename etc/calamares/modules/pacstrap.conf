#
### pacstrap Module
#
# This module installs the base system and then copies files
# into the installation that will be used in the installed system
#

---
# Additional pacstrap options
# --overwrite '*' forces overwriting of conflicting files
pacstrapOptions: "--overwrite '*'"

# basePackages is an array of package names to pass to pacstrap
#
basePackages:
  - base
  - base-devel
  - linux-cachyos
  - linux-cachyos-headers
  - linux-firmware
  - grub
  - efibootmgr
  - networkmanager
  - sudo
  - nano
  - vim
  # ── NO DESKTOP PACKAGES BELONG IN THIS LIST. THIS IS WHY. ────────────────
  # `pacstrap` runs at exec step 6 of settings.conf, LONG before
  # `packages@online` (netinstall) at step 13. Anything listed here is therefore
  # installed on EVERY machine, before the user's desktop choice is ever
  # consulted.
  #
  # This list used to carry the whole Plasma stack: plasma-desktop,
  # plasma-workspace, plasma-x11-session, plasma-nm, plasma-pa, sddm, dolphin,
  # konsole, kate, spectacle, breeze-gtk, polkit-kde-agent.
  #
  # THAT is the real reason "I picked Hyprland and KDE came anyway" survived
  # every previous attempt to fix it. packagechooser.conf and netinstall.yaml
  # were correct the whole time (`default: ""`, every desktop group
  # `selected: false`); they were simply IRRELEVANT, because Plasma had already
  # been pacstrapped in before netinstall ran. Fixes kept landing in the two
  # files that were not broken.
  #
  # Every desktop group in netinstall.yaml ships its own desktop AND its own
  # display manager (KDE/Hyprland/Cosmic/Niri -> sddm, GNOME -> gdm,
  # Xfce/Cinnamon/Budgie/LXDE -> lightdm), so nothing is lost by removing them
  # here — and "No Desktop" finally means no desktop.
  #
  # Keep this list to what EVERY install needs regardless of desktop: kernel,
  # bootloader, network, filesystems, audio, fonts, microcode, drivers.
  # Audio
  - pipewire
  - pipewire-alsa
  - pipewire-jack
  - pipewire-pulse
  - wireplumber
  # Network
  - wpa_supplicant
  # Fonts
  - noto-fonts
  - ttf-dejavu
  # System utilities
  - htop
  - wget
  - curl
  - git
  # File systems
  - btrfs-progs
  - dosfstools
  - ntfs-3g
  - xfsprogs
  - e2fsprogs
  - f2fs-tools
  # Hardware support
  - intel-ucode
  - amd-ucode
  - mesa
  # VirtualBox guest
  - virtualbox-guest-utils
  # CachyOS specific
  - cachyos-keyring
  - cachyos-mirrorlist
  # CachyOS replaced zlib with zlib-ng (cachyos/zlib-ng-compat provides+replaces
  # zlib). Listing it EXPLICITLY here makes pacstrap satisfy every "zlib" dep
  # with the compat package inside the same transaction, so plain Arch zlib is
  # never installed — otherwise the user's FIRST `pacman -Syu` interrupts with
  # "Replace zlib with cachyos/zlib-ng-compat?" (reported 2026-07-18; happened
  # on every fresh install). lib32-zlib-ng-compat is handled the same way in
  # the netinstall "Genesi OS" group (multilib isn't available to pacstrap).
  - zlib-ng-compat
  # chwd is invoked by the calamares chwd module during install (auto-detects
  # graphics drivers). Must be present in the target chroot or the install
  # aborts with "Failed to run chwd".
  - chwd

#
# postInstallFiles is an array of file names which will be copied into the system
#
# The paths should be relative to the host and the files will be copied to the
# location in the installed system
#
postInstallFiles:
  - "/etc/pacman.conf"
  - "/etc/default/grub"
  - "/etc/mkinitcpio.conf"
  # shellprocess@enable_ufw runs INSIDE the chroot and execs this exact path,
  # so we have to copy it from the live ISO into the target. Without it the
  # install aborts at job 44/46 with exit 127.
  - "/etc/calamares/scripts/enable-ufw"
