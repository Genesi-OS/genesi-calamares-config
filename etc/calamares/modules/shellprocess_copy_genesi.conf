---
# Runs on the LIVE ISO (dontChroot: true), BEFORE users so /etc/skel is
# populated when the users module creates /home/<user>, and BEFORE
# initcpio/grubcfg so plymouth theme + GRUB_DISTRIBUTOR land in the boot
# sequence.
#
# CRITICAL: every shell variable (anything written like $foo or ${foo})
# inside an inline `command:` block is interpreted by Calamares as a
# Calamares-side substitution. If Calamares doesn't know the name, the
# whole job aborts with "Missing variables". So all shell logic that
# needs local variables MUST live in external .sh scripts. Calamares does
# NOT export ROOT into the environment (it only expands ${ROOT} inside the
# command string), so every script below receives the expanded ${ROOT} as
# its first argument.
#
# Only ${ROOT}-style substitutions and static cp/mkdir lines belong here.
dontChroot: true
timeout: 3600
script:
 - "cp -rf /usr/share/genesi ${ROOT}/usr/share/ || true"
 # No copy of /usr/share/sddm/themes/genesi: the genesi-store package installs
 # that theme (Qt 6), and it lands before this module runs (packages@online).
 # Copying the live ISO's older theme over it left a theme with no
 # QtVersion=6, which SDDM starts with the Qt 5 greeter Arch no longer ships:
 # exit 127 and a black screen as soon as the user picked "Genesi" as their
 # login screen (user report: blank screen on logout).
 - "cp -rf /usr/share/plasma/desktoptheme/genesi-plasma ${ROOT}/usr/share/plasma/desktoptheme/ || true"
 - "cp -rf /usr/share/plymouth/themes/genesi ${ROOT}/usr/share/plymouth/themes/ || true"
 - "cp -rf /usr/share/icons/Tela-circle* ${ROOT}/usr/share/icons/ || true"
 - "cp -rf /usr/share/Kvantum/Genesi ${ROOT}/usr/share/Kvantum/ || true"
 - "cp -f /usr/share/color-schemes/Genesi* ${ROOT}/usr/share/color-schemes/ || true"
 - "cp -rf /usr/share/wallpapers/genesi ${ROOT}/usr/share/wallpapers/ || true"
 - "mkdir -p ${ROOT}/etc/sddm.conf.d"
 - "cp -f /etc/sddm.conf.d/genesi-theme.conf ${ROOT}/etc/sddm.conf.d/ || true"
 - "cp -f /etc/os-release ${ROOT}/etc/ || true"
 - "cp -f /etc/lsb-release ${ROOT}/etc/ || true"
 - "cp -f /etc/hostname ${ROOT}/etc/ || true"
 - "cp -f /usr/bin/genesi-* ${ROOT}/usr/bin/ || true"
 - "cp -f /usr/lib/systemd/system/genesi-* ${ROOT}/usr/lib/systemd/system/ || true"
 - "cp -f /etc/systemd/system/genesi-* ${ROOT}/etc/systemd/system/ || true"
 - "cp -f /usr/share/applications/genesi-* ${ROOT}/usr/share/applications/ || true"
 - "mkdir -p ${ROOT}/etc/skel"
 # External scripts — these own all shell logic that needs local variables.
 # See the .sh files for the rationale of each step.
 - "bash /etc/calamares/scripts/genesi-x11-detect.sh ${ROOT}"
 # genesi-copy-klassy.sh removed: Klassy is now the genesi-klassy package, installed
 # on the target via the KDE-Desktop netinstall group (pacman-owned). Copying the
 # live ISO's source-built klassy artifacts here created UNOWNED files on the target
 # that later blocked `pacman -S genesi-klassy` with "exists in filesystem".
 # System-wide KDE / Plasma defaults
 - "mkdir -p ${ROOT}/etc/xdg"
 - "cp -rf /etc/xdg/. ${ROOT}/etc/xdg/ || true"
 # Never leak the live-session config re-seeder into the installed system. It
 # would copy /usr/share/genesi/skel-override over the real user's ~/.config on
 # every login and silently undo theme fixes and personal settings.
 - "rm -f ${ROOT}/etc/xdg/autostart/genesi-branding.desktop"
 - "rm -f ${ROOT}/etc/systemd/system/genesi-branding.service"
 - "rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/genesi-branding.service"
 - "rm -f ${ROOT}/usr/local/bin/genesi-branding.sh"
 # /etc/skel from the live ISO is the canonical user-template; merge it on
 # top of whatever pacstrap installed so future users inherit Genesi
 # plasma configs (.config, .local, etc.).
 - "cp -rf /etc/skel/. ${ROOT}/etc/skel/ || true"
 # SDDM drop-ins (the theme, the display-server choice)
 - "mkdir -p ${ROOT}/etc/sddm.conf.d"
 - "cp -rf /etc/sddm.conf.d/. ${ROOT}/etc/sddm.conf.d/ || true"
 # ...but not the live session's autologin. 01-autologin.conf logs liveuser
 # straight into the live desktop; copied over, every install carried an
 # autologin for a user that removeuser deletes, and it fought the one the
 # user sets in System Settings, so that one did not stick (user report).
 # The users module writes the real autologin when the user ticks it.
 - "rm -f ${ROOT}/etc/sddm.conf.d/01-autologin.conf"
 - "[ -f /etc/sddm.conf ] && cp -f /etc/sddm.conf ${ROOT}/etc/sddm.conf || true"
 # Ant-Dark Plasma theme (desktoptheme + global theme) is built from source on the
 # live ISO (customize_airootfs section 12) and is NOT a package, so copy it to the
 # target explicitly. We deliberately NO LONGER blanket-copy the whole desktoptheme/
 # look-and-feel dirs: that dumped the source-built Klassy (kite-*) and Darkly themes
 # onto every target UNOWNED, which blocked `pacman -S genesi-klassy/genesi-darkly`
 # with "exists in filesystem" and left KWin without the decoration plugin. Klassy/
 # Darkly now arrive as pacman-owned packages via the KDE-Desktop netinstall group;
 # genesi-plasma is already copied above.
 - "mkdir -p ${ROOT}/usr/share/plasma/desktoptheme"
 - "cp -rf /usr/share/plasma/desktoptheme/Ant-Dark ${ROOT}/usr/share/plasma/desktoptheme/ || true"
 - "mkdir -p ${ROOT}/usr/share/plasma/look-and-feel"
 - "cp -rf /usr/share/plasma/look-and-feel/Ant-Dark ${ROOT}/usr/share/plasma/look-and-feel/ || true"
 # Defensive: apply skel to any pre-existing /home/<user> (no-op when
 # copy_genesi runs before the users module, as the current ordering does).
 - "bash /etc/calamares/scripts/genesi-apply-skel.sh ${ROOT}"
 # Final branding writes (os-release, GRUB_DISTRIBUTOR, plymouth theme,
 # grub.cfg regen).
 - "bash /etc/calamares/scripts/genesi-write-branding.sh ${ROOT}"
i18n:
 name: "Copying Genesi OS branding and icons to the target system..."
