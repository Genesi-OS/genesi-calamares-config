#
# shellprocess_genesi_grub.conf
# Genesi OS: authoritative GRUB finalization. Runs LAST (after bootloader +
# grubcfg) so it can rewrite /etc/default/grub deterministically and
# regenerate and validate grub.cfg in the target chroot. All logic lives in the
# external script so Calamares never tries to interpret $-variables as its own
# substitutions. The target root is passed as an ARGUMENT: Calamares expands
# ${ROOT} inside this command string but NEVER exports it into the script's
# environment (see CommandList.cpp), so an argument is the only reliable way
# to hand the mount point over. Boot-critical failures stop finalization.
---
dontChroot: true
timeout: 600

script:
 - command: "bash /etc/calamares/scripts/genesi-grub-setup.sh ${ROOT}"
   timeout: 600
   verbose: true

i18n:
 name: "Finalizing Genesi OS boot menu..."
 name[pt_BR]: "Finalizando o menu de inicialização do Genesi OS..."
