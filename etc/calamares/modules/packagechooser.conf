#
# Configuration for the low-density software chooser
---
mode: required

method: netinstall-select

labels:
    step: "Desktop"
    step[de]: "Desktop"
    step[fi]: "Työpöytä"
    step[fr]: "Bureau"
    step[it]: "Desktop"
    step[es]: "Escritorio"
    step[ru]: "Рабочий стол"
    step[zh_CN]: "桌面"
    step[ja]: "デスクトップ"
    step[sv]: "Skrivbord"
    step[pt_BR]: "Ambiente de Trabalho"

default: KDE-Desktop

items:
    - id: ""
      # packages: [] # This item installs no packages
      name: "No Desktop"
      name[nl]: "Geen desktop"
      name[de]: "Kein Desktop"
      description: "Please pick a desktop environment from the list. If you don't want to install a desktop, that's fine, your system will start up in text-only mode and you can install a desktop environment later."
      description[de]: "Bitte wählen Sie eine Desktop-Umgebung aus der Liste. Wenn Sie keine Desktop-Umgebung installieren möchten, ist das in Ordnung. Ihr System wird im Nur-Text-Modus gestartet und Sie können später eine Desktop-Umgebung installieren."
      description[nl]: "Kies eventueel een desktop-omgeving uit deze lijst. Als u geen desktop-omgeving wenst te gebruiken, kies er dan geen. In dat geval start het systeem straks op in tekst-modus en kunt u later alsnog een desktop-omgeving installeren."
      screenshot: ":/images/no-selection.png"

    - id: KDE-Desktop
      name: "Plasma Desktop"
      description: "Use Plasma to surf the web; keep in touch with colleagues, friends and family; manage your files, enjoy music and videos; and get creative and productive at work. Do it all in a beautiful environment that adapts to your needs, and with the safety, privacy-protection and peace of mind that the best Free Open Source Software has to offer."
      description[de]: "Nutze Plasma, um im Internet zu surfen, mit Kollegen, Freunden und Familie in Kontakt zu bleiben, Verwalte deine Dateien, genieße Musik und Video und sei kreativ und produktiv bei der Arbeit. Tu das alles in einer schönen Umgebung, die sich Deinen Bedürfnissen anpasst, und mit der Sicherheit, dem Schutz der Privatsphäre und dem Seelenfrieden, den die beste Freie Open-Source-Software zu bieten hat."
      description[fr]: "Utilisez Plasma pour surfer sur le web, rester en contact avec ses collègues, ses amis et sa famille, manager ses fichiers, profiter de sa musique et de ses vidéos et être créatif et productif au travail. Faites tout cela dans un bel environnement s’adaptant à vos besoins et vous offrant une meilleure sécurité, la protection de votre vie privé et une tranquillité d’esprit."
      description[it]: "Usa Plasma per navigare sul web; tieniti in contatto con colleghi, amici e famiglia; gestisci i tuoi file, goditi musica e video; e diventa creativo e produttivo al lavoro. Fai tutto questo in un bellissimo ambiente che si adatta alle tue esigenze, e con la sicurezza, la protezione della privacy e la tranquillità che il miglior software libero open source ha da offrire."
      description[es]: "Use Plasma para navegar por la web; manténgase en contacto con sus colegas, amigos y familiares; administre sus archivos, disfrute de música y vídeos; y sea creativo y productivo durante el trabajo. Haga todo esto en un agradable entorno que se adapta a sus necesidades con seguridad, protección de su privacidad y con la tranquilidad que le proporciona el mejor software libre de código abierto."
      description[ru]: "Используйте Plasma для серфинга в Интернете; поддерживайте связь с коллегами, друзьями и семьей; управляйте своими файлами, наслаждайтесь музыкой и видео; и проявляйте творческий подход и продуктивность на работе. Делайте все это в прекрасной среде, которая адаптируется к вашим потребностям, и с безопасностью, защитой конфиденциальности и спокойствием, которые может предложить лучшее бесплатное программное обеспечение с открытым исходным кодом."
      description[zh_CN]: "您可以使用 Plasma 桌面环境轻松浏览网页，与同事、朋友和家人保持联系，管理文件，欣赏音乐和视频，并在工作中发挥创意和提高效率。 Plasma 是自由开源软件界的明星产品，它的界面美观、安全可靠、尊重隐私且可按需定制，让您可以安心愉悦地每日使用。"
      description[ja]: "Plasma を使ってネットサーフィンをしたり、同僚や友人、家族と連絡を取ったり、ファイルを管理したり、音楽やビデオを楽しんだり、仕事で創造性や生産性を発揮することができます。そのすべてを、あなたのニーズに合わせた美しい環境と、最高のフリー・オープンソース・ソフトウェアが提供する安全性、プライバシー保護、安心感の中で行うことができるのです。"
      screenshot: "/etc/calamares/images/kde.png"

    - id: Hyprland-Desktop
      name: "Hyprland + caelestia-shell"
      description: "A modern Wayland tiling desktop: the Hyprland compositor paired with the caelestia-shell design (Quickshell widgets, no traditional panel). Sleek, keyboard-driven and animated, with the same Genesi apps and branding as the Plasma edition. Best on capable hardware with a working Wayland stack — pick Plasma if you are unsure or installing in a VM."
      description[pt_BR]: "Um desktop Wayland moderno em modo tiling: o compositor Hyprland com o design caelestia-shell (widgets Quickshell, sem painel tradicional). Elegante, controlado pelo teclado e animado, com os mesmos apps e identidade do Genesi da edição Plasma. Funciona melhor em hardware capaz com Wayland funcional — escolha o Plasma se estiver em dúvida ou instalando em uma máquina virtual."
      description[de]: "Ein moderner Wayland-Tiling-Desktop: der Hyprland-Compositor mit dem caelestia-shell-Design (Quickshell-Widgets, ohne klassische Leiste). Elegant, tastaturgesteuert und animiert, mit denselben Genesi-Apps und demselben Branding wie die Plasma-Edition. Am besten auf leistungsfähiger Hardware mit funktionierendem Wayland — wählen Sie Plasma im Zweifel oder bei der Installation in einer VM."
      description[es]: "Un escritorio Wayland moderno en mosaico: el compositor Hyprland junto al diseño caelestia-shell (widgets de Quickshell, sin panel tradicional). Elegante, controlado por teclado y animado, con las mismas aplicaciones e identidad de Genesi que la edición Plasma. Mejor en hardware capaz con Wayland funcional; elija Plasma si tiene dudas o instala en una máquina virtual."
      screenshot: "/etc/calamares/images/hyprland.png"

    # --- CachyOS desktop environments imported into the Genesi chooser
    # (Roadmap 5.1). Each item id MUST match a netinstall.yaml group name so the
    # netinstall-select method force-selects that group. First test batch:
    # GNOME/Xfce/Cinnamon/MATE — all use gdm/lightdm, which displaymanager.conf
    # already knows, so no display-manager work is needed for these. KDE stays
    # the default pick; the Genesi always-on group still layers on top.
    - id: GNOME-Desktop
      name: "GNOME"
      description: "Get things done with ease, comfort, and control. An easy and elegant way to use your computer, GNOME is designed to help you have the best possible computing experience."
      description[pt_BR]: "Faça as coisas com facilidade, conforto e controle. Uma forma simples e elegante de usar o computador, o GNOME foi projetado para lhe dar a melhor experiência possível."
      screenshot: "/etc/calamares/images/gnome.png"

    - id: Xfce4
      name: "Xfce4"
      description: "Xfce is a lightweight desktop environment for UNIX-like operating systems. It aims to be fast and low on system resources, while still being visually appealing and user friendly."
      description[pt_BR]: "O Xfce é um ambiente de trabalho leve para sistemas do tipo UNIX. Busca ser rápido e econômico em recursos, sem deixar de ser visualmente agradável e fácil de usar."
      screenshot: "/etc/calamares/images/xfce.png"

    - id: Cinnamon
      name: "Cinnamon"
      description: "Cinnamon is a Linux desktop which provides advanced innovative features and a traditional user experience."
      description[pt_BR]: "O Cinnamon é um desktop Linux que oferece recursos inovadores avançados e uma experiência de uso tradicional."
      screenshot: "/etc/calamares/images/cinnamon.png"

    - id: MATE-Desktop
      name: "Mate"
      description: "The MATE Desktop Environment is the continuation of GNOME 2. It provides an intuitive and attractive desktop environment using traditional metaphors for Linux and other Unix-like operating systems."
      description[pt_BR]: "O MATE Desktop é a continuação do GNOME 2. Oferece um ambiente de trabalho intuitivo e atraente usando convenções tradicionais para Linux e outros sistemas do tipo Unix."
      screenshot: "/etc/calamares/images/mate.png"

    # --- Second batch of CachyOS desktops/WMs. ids match the netinstall groups.
    - id: Budgie-Desktop
      name: "Budgie"
      description: "Budgie is an independent, familiar and modern desktop focused on simplicity and elegance, built on GNOME technologies."
      description[pt_BR]: "O Budgie é um ambiente independente, familiar e moderno, focado em simplicidade e elegância, construído sobre as tecnologias do GNOME."
      screenshot: "/etc/calamares/images/budgie.png"

    - id: LXQT-Desktop
      name: "LXQt"
      description: "LXQt is a lightweight Qt desktop environment. It is fast, low on resources and a good fit for older hardware."
      description[pt_BR]: "O LXQt é um ambiente de trabalho leve em Qt. É rápido, econômico em recursos e uma boa escolha para hardware mais antigo."
      screenshot: "/etc/calamares/images/lxqt.png"

    - id: LXDE-Desktop
      name: "LXDE"
      description: "LXDE is an extremely fast and energy-saving desktop environment, ideal for lower-end machines."
      description[pt_BR]: "O LXDE é um ambiente extremamente rápido e econômico em energia, ideal para máquinas mais modestas."
      screenshot: "/etc/calamares/images/lxde.png"

    - id: Cosmic
      name: "COSMIC"
      description: "COSMIC is a modern, performance-oriented desktop written in Rust by System76, designed for productivity and power users."
      description[pt_BR]: "O COSMIC é um ambiente moderno e focado em desempenho, escrito em Rust pela System76, voltado para produtividade e usuários avançados."
      screenshot: "/etc/calamares/images/cosmic.png"

    - id: Openbox
      name: "Openbox"
      description: "Openbox is a highly configurable, lightweight floating window manager with extensive standards support."
      description[pt_BR]: "O Openbox é um gerenciador de janelas flutuante, leve e altamente configurável, com amplo suporte a padrões."
      screenshot: "/etc/calamares/images/openbox.png"

    - id: i3-Window-Manager
      name: "i3"
      description: "i3 is a popular X11 tiling window manager known for its efficient use of screen space and single, self-contained config."
      description[pt_BR]: "O i3 é um gerenciador de janelas em mosaico (tiling) para X11, conhecido pelo uso eficiente da tela e por um único arquivo de configuração."
      screenshot: "/etc/calamares/images/i3.png"

    - id: Sway
      name: "Sway"
      description: "Sway is a tiling Wayland compositor and drop-in replacement for i3, compatible with existing i3 configurations."
      description[pt_BR]: "O Sway é um compositor Wayland em mosaico e substituto direto do i3, compatível com configurações i3 existentes."
      screenshot: "/etc/calamares/images/sway.png"

    - id: Qtile
      name: "Qtile"
      description: "Qtile is an X11/Wayland tiling window manager configured entirely in Python, with flexible layouts and widgets."
      description[pt_BR]: "O Qtile é um gerenciador de janelas em mosaico (X11/Wayland) configurado inteiramente em Python, com layouts e widgets flexíveis."
      screenshot: "/etc/calamares/images/qtile.png"

    - id: Wayfire
      name: "Wayfire"
      description: "Wayfire is a wlroots-based Wayland compositor that balances customization, extensibility and eye-candy."
      description[pt_BR]: "O Wayfire é um compositor Wayland baseado em wlroots que equilibra personalização, extensibilidade e efeitos visuais."
      screenshot: "/etc/calamares/images/wayfire.png"

    - id: Niri
      name: "Niri"
      description: "Niri is a scrollable-tiling Wayland compositor with a continuous grid layout, optimized for keyboard and touchpad."
      description[pt_BR]: "O Niri é um compositor Wayland de mosaico rolável, com um layout de grade contínua, otimizado para teclado e touchpad."
      screenshot: "/etc/calamares/images/niri.png"
